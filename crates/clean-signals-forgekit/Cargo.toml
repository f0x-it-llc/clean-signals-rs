# Standalone package: excluded from the root workspace (see the root
# Cargo.toml's `[workspace] exclude` and docs/DEVELOPMENT.md) so its path
# dependency on Frust — a native-only, remote-less sibling checkout — never
# enters the root workspace graph, lockfile, or the wasm definition-of-done
# gate. This `[workspace]` table makes this directory its own workspace root
# with its own Cargo.lock; every dependency below is therefore a literal spec
# rather than `{ workspace = true }` (workspace inheritance isn't available
# outside the root workspace), so the version/edition/license/repository fields
# are duplicated from the root's `[workspace.package]` verbatim.
[workspace]

[package]
name = "clean-signals-forgekit"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/f0x-it-llc/clean-signals-rs"
description = "Frust integration for clean-signals: component-scoped controllers and failure listeners"
publish = false

[dependencies]
clean-signals = { path = "../clean-signals" }
# Frust has no git remote (local-only sibling checkout), so this must be a
# relative path dep — which is exactly why this crate is workspace-independent
# and excluded from the root. Requires the sibling checkout at `../forgekit`
# (i.e. `<parent>/forgekit` next to `<parent>/clean-signals-rs`); swap this to a
# git+rev spec once Frust gains a remote, mirroring the clean-signals pin in
# Frust's own `examples/inbox`.
frust = { path = "../../../forgekit/crates/frust" }

# Dev-only: the headless glue tests drive Frust's `RenderRoot` directly (the
# desktop shell's own rebuild/layout/paint seam) and pump the reactive runtime's
# UI-thread local task queue frame by frame — no GPU, no window. `test-fixtures`
# pulls in clean-signals' shared fake failures/use cases (never duplicated here,
# per CODE_STANDARDS). kurbo/peniko are pinned to Frust's rendering-stack
# versions so the geometry/color types unify.
[dev-dependencies]
clean-signals = { path = "../clean-signals", features = ["test-fixtures"] }
frust-core = { path = "../../../forgekit/crates/frust-core" }
frust-reactive = { path = "../../../forgekit/crates/frust-reactive" }
frust-scene = { path = "../../../forgekit/crates/frust-scene" }
frust-text = { path = "../../../forgekit/crates/frust-text" }
reactive_graph = "0.2"
kurbo = "0.13.1"
peniko = "0.6.1"
# Dev-only, for interval.rs's lifted `run_interval` unit test (`#[tokio::test]`
# — the loop's `clean_signals::time::sleep` needs a tokio runtime with the
# time driver enabled). Not a lib dependency: the crate's own production code
# never spawns a tokio runtime directly (see docs/CODE_STANDARDS.md's "No
# sleeps outside time::sleep").
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
