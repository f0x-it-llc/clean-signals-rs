[package]
name = "clean-signals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Clean-architecture framework for Leptos apps: use cases, controllers, retry, failures-as-events — built on reactive_graph"

[features]
default = []
# Exposes the test fixtures (fake use cases, fixture failures) to downstream tests.
test-fixtures = []
# Forward reactive_graph's effects feature (needed for Effect::new to run in tests/CSR).
effects = ["reactive_graph/effects"]

[dependencies]
reactive_graph = { workspace = true }
any_spawner = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }

[dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }
any_spawner = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
