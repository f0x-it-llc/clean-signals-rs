[package]
name = "clean-signals-leptos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Leptos 0.8 integration for clean-signals: component-scoped controllers, AsyncView, failure listeners, safe polling"

[dependencies]
